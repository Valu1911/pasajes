<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion</title>
  <link rel="stylesheet" href="./assets/styles/styles.css">
</head>
<body>

  <div class="bg-circles">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="card">
    <div class="header">
      <div class="bus-icon" title="Panel de Administración">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="6" width="38" height="28" rx="4" stroke="white" stroke-width="2.2"/>
          <line x1="26" y1="6" x2="26" y2="26" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="7" y1="26" x2="45" y2="26" stroke="white" stroke-width="1.8"/>
          <rect x="10" y="10" width="12" height="9" rx="2" stroke="white" stroke-width="1.8"/>
          <rect x="30" y="10" width="12" height="9" rx="2" stroke="white" stroke-width="1.8"/>
          <line x1="9" y1="34" x2="43" y2="34" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="38" r="4.5" stroke="white" stroke-width="2.2"/>
          <circle cx="16" cy="38" r="1.8" fill="white"/>
          <circle cx="36" cy="38" r="4.5" stroke="white" stroke-width="2.2"/>
          <circle cx="36" cy="38" r="1.8" fill="white"/>
          <rect x="2" y="14" width="5" height="6" rx="1.5" fill="rgba(255,255,255,0.45)"/>
          <rect x="45" y="14" width="5" height="6" rx="1.5" fill="rgba(255,255,255,0.45)"/>
        </svg>
      </div>
      <h1>¡Bienvenido!</h1>
      <p class="subtitle">Panel de Administración</p>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" spellcheck="false"/>
      </div>
      <p class="error-msg" id="err-usuario">Ingresá tu nombre de usuario</p>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="contrasena" placeholder="Contraseña" autocomplete="current-password"/>
        <button class="toggle-pw" type="button" id="togglePw" aria-label="Mostrar contraseña">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <p class="error-msg" id="err-contrasena">Ingresá tu contraseña</p>
    </div>

    <button class="btn-submit" id="btnLogin" onclick="handleLogin()">
      <span class="btn-text">Iniciar Sesión</span>
      <div class="spinner"></div>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./js/main.js"></script>
</body>
</html>
